[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotive-gait"
version = "0.1.0"
description = "Emotion-modulated bipedal gait for a humanoid robot in MuJoCo"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.2.0",
    "mujoco-menagerie",
    "numpy",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.17.2"]  # ruff pinned to match .pre-commit-config.yaml

[project.scripts]
emotive-gait = "emotive_gait.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs/archive", "docs/superpowers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_gl: needs an OpenGL context for mujoco.Renderer and ffmpeg on PATH (skipped if absent)",
]
