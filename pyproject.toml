[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotive-gait"
version = "0.1.0"
description = "Emotion-modulated bipedal gait for a humanoid robot in MuJoCo"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pinned to the 3.2.x line this code was verified on. MjSpec's API changed by
    # 3.17 (find_body -> body; MjsGeom.delete() removed), which breaks neck.py and
    # root.py. The upgrade is Phase 4 work, alongside mink. See CLAUDE.md.
    "mujoco>=3.2.0,<3.3",
    # Exact pin: the wheel carries the model registry, so this also pins the G1 model OID
    # (ad24af3fa9bc1a99e37291e656fb85e445da6158) that NeckConfig's mass constants assume.
    "mujoco-menagerie==2026.10.4",
    "numpy",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.17.2"]  # ruff pinned to match .pre-commit-config.yaml

[project.scripts]
emotive-gait = "emotive_gait.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs/archive", "docs/superpowers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_gl: needs an OpenGL context for mujoco.Renderer and ffmpeg on PATH (skipped if absent)",
]
