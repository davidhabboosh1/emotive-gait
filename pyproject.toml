[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotive-gait"
version = "0.4.1"
description = "Emotion-modulated bipedal gait for a humanoid robot in MuJoCo"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pinned to the 3.17 line this code was verified on (MjSpec: body(), spec.delete(obj)).
    # Raising the upper bound is a deliberate re-verify; see CLAUDE.md.
    "mujoco>=3.17,<3.18",
    # Exact pin: the wheel carries the model registry, so this also pins the G1 model OID
    # (ad24af3fa9bc1a99e37291e656fb85e445da6158) that NeckConfig's mass constants assume.
    "mujoco-menagerie==2026.10.4",
    "numpy",
    "scipy",
    "pyyaml",
    "mink>=1.3,<2",
    "qpsolvers[daqp]>=4,<5",
]

[project.optional-dependencies]
fit = ["statsmodels>=0.14", "pandas>=2"]  # the learn/ pipeline; the runtime needs neither
mcp = ["mcp>=2,<3"]  # the MCP server (rig/server.py)
dev = ["pytest", "ruff==0.17.2", "statsmodels>=0.14", "pandas>=2", "mcp>=2,<3"]  # ruff pinned to match .pre-commit-config.yaml

[project.scripts]
emotive-gait = "emotive_gait.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"emotive_gait.emotion" = ["data/*.yaml"]
"emotive_gait.rig" = ["data/*.yaml"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs/archive", "docs/superpowers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_gl: needs an OpenGL context for mujoco.Renderer and ffmpeg on PATH (skipped if absent)",
]
