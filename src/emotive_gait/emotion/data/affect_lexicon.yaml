# Affect lexicon for `emotive_gait.emotion.prompt`.
#
# TUNED, NOT CITED. This table is hand-written by the project authors. No published
# lexicon, norm set or study supplied these terms or weights; the weights are a judgement of
# how strongly a word signals its emotion on a (0, 1] scale and nothing here is evidence
# for any gait claim. Edit freely; the evidence table lives in `emotion/evidence.py`.
#
# Format: `terms:` maps a single lower-case word or a two-word phrase to
# `[emotion, weight]`, emotion one of anger, disgust, fear, happiness, sadness, surprise.
terms:
