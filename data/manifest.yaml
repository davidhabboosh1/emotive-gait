# Data manifest for the learned emotion model (see emotive_gait.learn.manifest for the layout).
# Frozen 2026-10-26 (Phase 4.5, Task 9). Every file below was hashed after download; `fit` and
# `fetch` refuse a file whose SHA-256 differs. Label kinds follow spec 4.1: `exact` for
# angry/happy/sad/scared/neutral/normal, `mapped` for Depressed, Elated, HappyGoLucky, the
# ambiguous "happy or fast walk forward" and BML `af`. Actor ids: one per performer.
#
# Data decisions (verified on the downloaded files):
# 100STYLE (Mason, Starke & Komura 2022; Zenodo 8127870, CC BY 4.0)
#   - Archive 1,468,515,354 bytes, md5 3cf627852fd8192024c04a8d0ef49583 (matches Zenodo).
#   - BVH bones (Neutral_FW.bvh header): Hips (root, 6 channels), Chest, Chest2, Chest3, Chest4,
#     Neck, Head, Right/LeftCollar, Right/LeftShoulder, Right/LeftElbow, Right/LeftWrist,
#     Right/LeftHip, Right/LeftKnee, Right/LeftAnkle, Right/LeftToe (23 joints in the file,
#     not the 28 bones the dataset page states). 60 fps, y up.
#   - Unit: OFFSETs are centimetres (Hips->Chest 12.95), scale 0.01; with it the Neutral hips
#     sit at 0.97 m and the head at 1.60 m.
#   - Frame cuts (Frame_Cuts.csv FW_START/FW_STOP): Angry 569-4407, Depressed 410-9154,
#     Elated 482-4956, Neutral 327-7445. Proud (497-6181) excluded: not a basic emotion.
#     100STYLE has no Sad, Happy or Fear style; Depressed -> sadness and Elated -> happiness
#     are `mapped`. One actor (100style_actor).
# CMU Graphics Lab MoCap (free for all uses; "The data used in this project was obtained from
#   mocap.cs.cmu.edu. The database was created with funding from NSF EIA-0196217.")
#   - Trial numbers are zero-padded to two digits in the URLs (104_02).
#   - Subject 82: normal walk 11 and 13; sad 10; happy 12 ("happy or fast walk forward",
#     ambiguous label: mapped). 8 (stand still; casual walk) and 9 (confident) excluded.
#   - Subject 91: normal walk 29, 31, 34; sad 13 (SadWalk, exact) and 14 (DepressedWalk,
#     mapped); scared 32 (ScaredWalk). Shy 20, Macho 33, TooCool 12 excluded (not basic
#     emotions). Other neutral-looking trials (2/36 WalkStraight, 4 Walking, 57 WalkForward)
#     not used: the three NormalWalk trials are the labelled neutral.
#   - Subject 104: neutral 02 ("neutral Male walk, exact footfalls"); happy 11
#     (HappyGoLuckWalk, mapped). Excited 12 and Stern 28/29 excluded (not basic emotions);
#     22 RegularWalk8 excluded (figure eight, turning); 14 HappyStartWalk not used (a walk
#     started from standing, outside the brief's verified list); 19 CasualWalk not used (02
#     is the labelled neutral).
#   - Subjects 91 and 105 are byte-identical uploads (same SHA-256 for the ASF and all six
#     AMC trials, re-checked in Task 9): one performer; 105 excluded as a duplicate (Ruling K),
#     not merged, so no cycle is counted twice. Actor cmu_91.
#   - Subject 142 excluded: no normal or neutral walk (13 Relaxed considered and rejected),
#     per-actor-neutral rule (spec 4.1). Fear therefore rests on cmu_91 trial 32 alone: thin.
# Body Movement Library (Ma, Paterson & Pollick 2006; PACO lab, Glasgow)
#   - committable: false until the PACO lab's written permission arrives (contact: Professor
#     Frank Pollick, frank.pollick@glasgow.ac.uk); local fits only.
#   - PTD format: line 1 = frame count N, then N (sometimes N+1, the last a duplicate) rows of
#     45 floats, no frame-number column, 60 Hz, INCHES (scale 0.0254), z up.
#   - The 15 columns (JointIndex.jpg order): Head, Neck, LShoulder, LElbow, LWrist, RShoulder,
#     RElbow, RWrist, Pelvis, LHip, LKnee, LAnkle, RHip, RKnee, RAnkle. Head AND neck points
#     exist, so neck_pitch is measured; no CSM fallback is needed.
#   - Walk records: record 1 = anticlockwise, record 2 = clockwise (data page). The archive has
#     NO start/end-frame files for walks (only for throw/seq/lift/knock): walks are used whole
#     and turning cycles are rejected by the extractor's per-cycle heading rule.
#   - Codes an/ha/sa/nu are `exact`. A fifth code `af` exists for 7 actors (ale, jan, jua,
#     lin, mac, pet, she; records 1 and 2): undocumented in the archive (Key.pdf is the actor
#     table, alt_naming_convention_PTD.pdf a marker list); assumed 'afraid' and mapped to fear.
#   - Archive defects ("Problems with the data.pdf"): kat walk_sa_1 head point buried in the
#     chest (the extracted neck_pitch is implausible): excluded. The PDF says chr walk_nu_2 is
#     missing "so there is no anticlockwise walk"; in the PTD set chr_walk_nu_2 is a real
#     clockwise walk and chr_walk_nu_1 (the anticlockwise record) is a static placeholder
#     (every frame identical): nu_1 excluded, nu_2 kept.
